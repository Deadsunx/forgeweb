<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FORGEWEB">
  <!--
    FORGEWEB mark: an anvil (forge) topped by a mint I-beam text cursor (web).
    Redrawn as vector geometry so it stays crisp at any size and legible at
    16px. Tiled here so it reads on both light and dark browser chrome; the
    header uses the same shapes untiled — see LogoMark in src/ForgeWeb.jsx,
    and keep the two in step.
  -->
  <rect width="32" height="32" rx="8" fill="#121620"/>
  <g transform="translate(1.9 1.6) scale(0.88)">
    <g fill="#F1EFE6">
      <path d="M8.4 13.1 H2.8 L8.4 18.7 Z"/>
      <path d="M23.6 13.1 H29.2 L23.6 18.1 Z"/>
      <rect x="8.4" y="12.4" width="15.2" height="6.4" rx="0.7"/>
      <rect x="12.6" y="18.8" width="6.8" height="2.8"/>
      <path d="M12.6 21.6 H19.4 L22.8 24.6 H9.2 Z"/>
      <rect x="6.2" y="24.6" width="19.6" height="3.2" rx="0.7"/>
    </g>
    <g fill="#3FDDB0">
      <rect x="13.7" y="4.4" width="4.6" height="1.6" rx="0.5"/>
      <rect x="15.1" y="5.6" width="1.8" height="5.2"/>
      <rect x="13.7" y="10.4" width="4.6" height="1.6" rx="0.5"/>
    </g>
  </g>
</svg>
